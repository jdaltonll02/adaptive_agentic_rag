# eval_condor_strategy_qa.yaml — evaluation on StrategyQA

defaults:
  - condor_nq
  - _self_

wandb:
  project: verl_condor_eval
  experiment: condor_eval_strategy_qa

data:
  val_files:    ["${paths.strategy_qa.test}"]
  val_dataset:  strategyqa
  val_batch_size: 32
  max_prompt_length: 1024
  max_response_length: 16
  prompt_key: prompt
  trust_remote_code: false

eval:
  checkpoint_path: "${paths.rl_checkpoint_dir}/latest"
  router_checkpoint: null
  max_turn: 5
  eval_batch_size: 8

trainer:
  project_name:     "${wandb.project}"
  experiment_name:  "${wandb.experiment}"
  logger:           [wandb]
  n_gpus_per_node:  1
  nnodes:           1
  ray_num_cpus:     null
  log_dir:          "${paths.logs_dir}"
  metrics_dir:      "${paths.metrics_dir}"
  plots_dir:        "${paths.plots_dir}"
  checkpoint_dir:   "${paths.rl_checkpoint_dir}"
  val_only:         true
  val_before_train: true
  total_epochs:     1

condor:
  use_condor: true
  l0_reward_threshold: 0.5
  epsilon_start: 0.0
  epsilon_end:   0.0
  epsilon_decay: 1.0


# ── Algorithm overrides for eval (disables critic) ───────────────────────────
algorithm:
  use_kl_in_reward: false
  adv_estimator: grpo

actor_rollout_ref:
  rollout:
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.8
  actor:
    fsdp_config:
      model_dtype: bfloat16
