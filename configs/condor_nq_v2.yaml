# condor_nq.yaml
# Full Hydra config for CONDOR training on Natural Questions (NQ).
#
# Usage
#   python -m verl.trainer.main_ppo_condor \
#       --config-path /home/jgibson2/projects/adaptive_rag/configs \
#       --config-name condor_nq
#
# All paths and hyperparameters are defined here or in paths.yaml (included
# via the defaults list).  Do NOT hardcode paths in Python source files.

defaults:
  - paths          # injects the `paths:` subtree from paths.yaml
  - _self_         # overrides below win over the defaults

# ── W&B / tracking ────────────────────────────────────────────────────────────
wandb:
  project: verl_condor_nq_v2
  experiment: condor_qwen2.5_7b_nq_v2   # overridden at runtime with timestamp suffix

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  train_files:            ["${paths.nq.train_10k}"]
  val_files:              ["${paths.nq.test}"]
  train_batch_size:       96
  val_batch_size:         96
  max_prompt_length:      1024
  max_response_length:    1024
  filter_overlong_prompts: false
  truncation:             right
  return_raw_chat:        true
  return_full_prompt:     false
  shuffle:                true
  prompt_key:             prompt
  reward_fn_key:          data_source
  return_raw_input_ids:   false
  filter_overlong_prompts_workers: 1
  trust_remote_code:      false
  image_key:              images
  video_key:              videos
  custom_cls:
    path: null
    name: null

# ── Actor / Rollout / Reference policy ───────────────────────────────────────
actor_rollout_ref:
  hybrid_engine: true
  model:
    path:                         "${paths.sft_checkpoint}"
    enable_gradient_checkpointing: true
    enable_activation_offload:    false
    use_remove_padding:           false
    lora_rank:                    0
    lora_alpha:                   16
    target_modules:               all-linear
    use_liger:                    false
    use_fused_kernels:            false
    trust_remote_code:            false
    external_lib:                 null
    override_config:              {attn_implementation: sdpa}
    use_shm:                      false
    dtype:                        bfloat16
  actor:
    strategy:                     fsdp
    ppo_mini_batch_size:          96
    ppo_micro_batch_size:         null
    ppo_micro_batch_size_per_gpu: 4
    use_dynamic_bsz:              false
    ppo_max_token_len_per_gpu:    16384
    grad_clip:                    1.0
    clip_ratio:                   0.2
    clip_ratio_low:               0.2
    clip_ratio_high:              0.2
    clip_ratio_c:                 3.0
    loss_agg_mode:                token-mean
    entropy_coeff:                0
    use_kl_loss:                  false
    use_torch_compile:            false
    kl_loss_coef:                 0.01
    kl_loss_type:                 low_var_kl
    ppo_epochs:                   1
    shuffle:                      false
    ulysses_sequence_parallel_size: 1
    checkpoint:
      contents: [model, optimizer, extra]
    optim:
      lr:                       1.0e-6
      lr_warmup_steps:          -1
      lr_warmup_steps_ratio:    0.0
      min_lr_ratio:             0.0
      num_cycles:               0.5
      warmup_style:             constant
      total_training_steps:     -1
      weight_decay:             0.01
    fsdp_config:
      wrap_policy:
        min_num_params: 0
      param_offload:       false
      optimizer_offload:   true
      offload_policy:      false
      reshard_after_forward: true
      fsdp_size:           -1
      # fsdp_workers.py line 206: actor defaults to torch.float32 ("optimizer must be fp32").
      # That gives 14 GB fp32 master weights + 14 GB fp32 grads + 14 GB exp_avg + 14 GB
      # exp_avg_sq = 56 GB, which OOMs on L40S 44 GB.  Override to bf16: FlatParams stay
      # bf16, optimizer states are bf16 (7+7=14 GB total), peak ~30 GB — fits.
      model_dtype: bfloat16
      mixed_precision:
        param_dtype: bf16
        reduce_dtype: bf16
        buffer_dtype: fp32
  rollout:
    mode:                               sync
    name:                               vllm
    temperature:                        1.0
    top_k:                              -1
    top_p:                              1.0
    max_model_len:                      8192
    prompt_length:                      1024
    response_length:                    1024
    dtype:                              bfloat16
    disable_log_stats:                  true
    enable_chunked_prefill:             false
    engine_kwargs:                      {}
    log_prob_micro_batch_size:          null
    log_prob_micro_batch_size_per_gpu:  4
    log_prob_max_token_len_per_gpu:     16384
    log_prob_use_dynamic_bsz:           false
    tensor_model_parallel_size:         2
    gpu_memory_utilization:             0.4
    ignore_eos:                         false
    enforce_eager:                      true
    free_cache_engine:                  true
    load_format:                        dummy_dtensor
    layered_summon:                     false
    n:                                  1
    val_kwargs:
      top_k:       -1
      top_p:       1.0
      temperature: 0
      do_sample:   false
      n:           1
    multi_turn:
      enable: true
      format: chatml
      max_assistant_turns: 5
      tool_config_path: "${paths.project_root}/configs/tool_config_condor.yaml"
  ref:
    log_prob_micro_batch_size:          null
    log_prob_micro_batch_size_per_gpu:  4
    log_prob_use_dynamic_bsz:           false
    log_prob_max_token_len_per_gpu:     16384
    use_remove_padding:                 false
    use_fused_kernels:                  false
    # dp_actor.py reads these from config.ref
    ulysses_sequence_parallel_size:     1
    ppo_mini_batch_size:                96
    ppo_micro_batch_size:               null
    ppo_micro_batch_size_per_gpu:       4
    ppo_max_token_len_per_gpu:          16384
    use_dynamic_bsz:                    false
    use_kl_loss:                        false
    kl_loss_coef:                       0.01
    kl_loss_type:                       low_var_kl
    clip_ratio:                         0.2
    clip_ratio_low:                     0.2
    clip_ratio_high:                    0.2
    entropy_coeff:                      0
    loss_agg_mode:                      token-mean
    grad_clip:                          1.0
    ppo_epochs:                         1
    fsdp_config:
      param_offload:         true
      reshard_after_forward: true
      wrap_policy:
        min_num_params: 0

# ── Critic ────────────────────────────────────────────────────────────────────
critic:
  strategy:   fsdp
  optim:
    lr:                       1.0e-5
    lr_warmup_steps:          -1
    lr_warmup_steps_ratio:    0.0
    min_lr_ratio:             0.0
    num_cycles:               0.5
    warmup_style:             constant
    total_training_steps:     -1
    weight_decay:             0.01
  model:
    path:                         "${paths.sft_checkpoint}"
    tokenizer_path:               "${paths.sft_checkpoint}"
    enable_gradient_checkpointing: true
    enable_activation_offload:    false
    use_remove_padding:           false
    lora_rank:                    0
    lora_alpha:                   16
    target_modules:               all-linear
    use_liger:                    false
    use_fused_kernels:            false
    trust_remote_code:            false
    external_lib:                 null
    override_config:              {attn_implementation: sdpa}
    use_shm:                      false
    fsdp_config:
      wrap_policy:
        min_num_params: 0
      param_offload:         true
      optimizer_offload:     true
      offload_policy:        false
      reshard_after_forward: true
      fsdp_size:             -1
  rollout_n:                    1
  ppo_mini_batch_size:          96
  ppo_micro_batch_size:         null
  ppo_micro_batch_size_per_gpu: 4
  ppo_max_token_len_per_gpu:    32768
  forward_micro_batch_size:     null
  forward_micro_batch_size_per_gpu: 4
  forward_max_token_len_per_gpu: 32768
  use_dynamic_bsz:              false
  grad_clip:                    1.0
  ppo_epochs:                   1
  shuffle:                      false
  ulysses_sequence_parallel_size: 1
  cliprange_value:              0.5
  loss_agg_mode:                token-mean
  checkpoint:
    contents: [model, optimizer, extra]
  fsdp_config:
    wrap_policy:
      min_num_params: 0
    param_offload:         false
    optimizer_offload:     false
    offload_policy:        false
    reshard_after_forward: true
    fsdp_size:             -1

# ── Algorithm ─────────────────────────────────────────────────────────────────
algorithm:
  adv_estimator:          grpo
  gamma:                  1.0
  lam:                    0.95
  use_kl_in_reward:       true
  kl_penalty:             kl
  norm_adv_by_std_in_grpo: true
  use_pf_ppo:             false
  pf_ppo:
    reweight_method: pow
    weight_pow:      2.0
  kl_ctrl:
    type:      fixed
    kl_coef:   0.001
    horizon:   10000
    target_kl: 0.1

# ── Trainer ───────────────────────────────────────────────────────────────────
trainer:
  total_epochs:     1
  n_gpus_per_node:  2
  nnodes:           1
  save_freq:        10
  test_freq:        10
  max_actor_ckpt_to_keep: 2
  critic_warmup:    0
  val_before_train: true
  val_only:         false
  balance_batch:    false
  logger:           [wandb]
  project_name:     "${wandb.project}"
  experiment_name:  "${wandb.experiment}"

  # Output directories (light = repo/outputs; heavy = /data/user_data/jgibson2/condor)
  device:            cuda
  total_training_steps: 100
  log_val_generations: 0
  resume_mode:       disable
  resume_from_path:  null
  default_hdfs_dir:  null
  default_local_dir: "${paths.rl_checkpoint_dir}/${trainer.project_name}/${trainer.experiment_name}"
  del_local_ckpt_after_load: false
  ray_wait_register_center_timeout: 300
  log_dir:           "${paths.logs_dir}"
  metrics_dir:       "${paths.metrics_dir}"
  plots_dir:         "${paths.plots_dir}"
  checkpoint_dir:    "${paths.rl_checkpoint_dir}"

# ── CONDOR two-level RL parameters ───────────────────────────────────────────
condor:
  use_condor: true

  # L0 mechanism router
  epsilon_start:    0.9     # initial exploration rate
  epsilon_end:      0.1     # final exploration rate
  epsilon_decay:    1000    # e-folding steps for epsilon
  router_lr:        1.0e-3  # REINFORCE policy learning rate
  reinforce_gamma:  0.99    # discount factor for REINFORCE returns

  # Dual gradient descent (Lagrange multipliers)
  lambda_hi_init:   0.10    # initial λ_hi (L0 budget constraint, spec Part A)
  lambda_lo_init:   0.08    # initial λ_lo (L1 cost, spec Part A)
  budget_hi:        0.0005  # L0 cost sub-budget (USD/query, spec Eq. 1)
  budget_lo:        0.0004  # L1 cost sub-budget (USD/query, spec Eq. 2)
  dual_lr_hi:       5.0e-4  # Adam lr for λ_hi (slowest timescale, spec Eq. 15)
  dual_lr_lo:       1.0e-3  # Adam lr for λ_lo (slow timescale, spec Eq. 14)

  # Phi-critic blended counterfactual baseline
  phi_t_warmup:     500     # step at which alpha_t = 0.5
  phi_tau_trans:    100.0   # sharpness of phi→critic transition (sigmoid scale)
  phi_lr:           1.0e-3  # MLP learning rate

  # Reward shaping
  l0_reward_threshold: 0.2  # F1 threshold for l0_correct binary signal

  # Trajectory clustering (failure taxonomy)
  cluster_report_freq: 50   # run K-Means report every N global steps

  # Per-process timeout for run_workflow subprocesses (seconds).
  # Prevents a stalled vLLM/retrieval call from hanging the entire validation
  # or training turn indefinitely (root cause of job 9277115 failure).
  workflow_timeout: 120

# ── Reward model (disabled — CONDOR uses its own reward manager) ──────────────
reward_model:
  enable: false
  strategy: fsdp
  micro_batch_size: null
  micro_batch_size_per_gpu: null
  use_dynamic_bsz: false
  model:
    input_tokenizer: ${actor_rollout_ref.model.path}
    path: ~/models/reward_model
    use_shm: false
    external_lib: ${actor_rollout_ref.model.external_lib}
    use_remove_padding: false
    use_fused_kernels: ${actor_rollout_ref.model.use_fused_kernels}
    trust_remote_code: false
    fsdp_config:
      wrap_policy:
        min_num_params: 0
      param_offload: false
      reshard_after_forward: true
  reward_kwargs: {}

# ── Ray initialisation ────────────────────────────────────────────────────────
ray_init:
  num_cpus: null
