# paths.yaml
# Single source of truth for every filesystem path used by CONDOR.
#
# Convention
# ----------
# aqawflow_data : all data now lives under condor/data/ (aqawflow/ was deleted)
# heavy_root    : /data/user_data/jgibson2/condor  (CONDOR checkpoints, generated data)
# light_root    : repo-local directory for metrics, plots, logs (small files, in repo)
#
# All dataset parquets live under condor/data/.
# Run slurm/setup_condor_data.slurm once to populate models, retriever, and test splits.

paths:
  # ── Repo roots ──────────────────────────────────────────────────────────────
  project_root:   /home/jgibson2/projects/adaptive_rag
  baseline_root:  /home/jgibson2/projects/adaptive_rag/baseline

  # ── Data root (all data now lives under condor/) ────────────────────────────
  aqawflow_data:  /data/user_data/jgibson2/condor/data

  # ── Heavy-output root (CONDOR checkpoints, generated data) ──────────────────
  heavy_root:     /data/user_data/jgibson2/condor

  # ── Light-output root (metrics, plots — lives in repo/outputs/) ─────────────
  light_root:     /home/jgibson2/projects/adaptive_rag/outputs

  # ── Training & evaluation data parquets ─────────────────────────────────────
  nq:
    train:     /data/user_data/jgibson2/condor/data/nq/train.parquet
    train_10k: /data/user_data/jgibson2/condor/data/nq/train_10k.parquet
    test:      /data/user_data/jgibson2/condor/data/nq/test_996.parquet

  hotpot_qa:
    train:  /data/user_data/jgibson2/condor/data/hotpot_qa/train.parquet
    test:   /data/user_data/jgibson2/condor/data/hotpot_qa/test_996.parquet

  ambig_qa:
    train:  /data/user_data/jgibson2/condor/data/ambig_qa/train.parquet
    test:   /data/user_data/jgibson2/condor/data/ambig_qa/test_996.parquet

  musique:
    train:  /data/user_data/jgibson2/condor/data/musique/train.parquet
    test:   /data/user_data/jgibson2/condor/data/musique/test_996.parquet

  two_wiki:
    train:  /data/user_data/jgibson2/condor/data/2wikimultihop_qa/train.parquet
    test:   /data/user_data/jgibson2/condor/data/2wikimultihop_qa/test_996.parquet

  bamboogle:
    test:   /data/user_data/jgibson2/condor/data/bamboogle/test.parquet

  pop_qa:
    test:   /data/user_data/jgibson2/condor/data/pop_qa/test_996.parquet

  frames:
    test:   /data/user_data/jgibson2/condor/data/frames/test_996.parquet

  strategy_qa:
    train:  /data/user_data/jgibson2/condor/data/strategy_qa/train.parquet
    test:   /data/user_data/jgibson2/condor/data/strategy_qa/test_996.parquet

  cwq:
    train:  /data/user_data/jgibson2/condor/data/cwq/train.parquet
    test:   /data/user_data/jgibson2/condor/data/cwq/test_996.parquet

  trivia_qa:
    train:  /data/user_data/jgibson2/condor/data/trivia_qa/train.parquet
    test:   /data/user_data/jgibson2/condor/data/trivia_qa/test_996.parquet

  kilt_nq:
    test:   /data/user_data/jgibson2/condor/data/kilt_nq/test_996.parquet

  # ── Model checkpoints ───────────────────────────────────────────────────────
  # L1 PlanningAgent (actor trained via PPO) — Qwen2.5-7B-Instruct
  sft_checkpoint:         /data/user_data/jgibson2/condor/checkpoints/sft/qwen2.5_7b_instruct
  # Executor agent (frozen, served via vLLM) — Qwen2.5-14B-Instruct
  executor_checkpoint:    /data/user_data/jgibson2/condor/checkpoints/sft/qwen2.5_14b_instruct
  rl_checkpoint_dir:      /data/user_data/jgibson2/condor/checkpoints/rl

  # ── Light outputs (metrics / plots — committed to repo) ──────────────────────
  metrics_dir:  /home/jgibson2/projects/adaptive_rag/outputs/metrics
  plots_dir:    /home/jgibson2/projects/adaptive_rag/outputs/plots
  logs_dir:     /home/jgibson2/projects/adaptive_rag/outputs/logs

  # ── SLURM job logs (heavy) ───────────────────────────────────────────────────
  slurm_log_dir: /data/user_data/jgibson2/condor/logs/slurm

  # ── Services ─────────────────────────────────────────────────────────────────
  retrieval_api_url: http://localhost:8000/search
